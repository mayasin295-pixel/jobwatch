name: job-alerts

on:
  schedule:
    - cron: "*/30 * * * *"   # כל 30 דקות
  workflow_dispatch:          # הרצה ידנית מהטלפון או מהדפדפן

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python jobwatch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILE_TEXT: ${{ secrets.PROFILE_TEXT }}
      - name: save state
        run: |
          git config user.name "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
      - name: build site
        run: |
          mkdir _site
          cp index.html _site/
          cp state.json _site/ 2>/dev/null || echo '{"jobs":{}}' > _site/state.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
