<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המשרות שלי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#F3F6F5;--sf:#fff;--ink:#13262B;--mute:#566A6E;--line:#D5E0DE;--teal:#0B6E6A;--tbg:#DDF1EE;--amb:#9A4A06;--abg:#FCE9C6;--rose:#9F1239;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A1D;--sf:#152429;--ink:#E7F0EE;--mute:#9DB1B3;--line:#27393D;--teal:#5CD1C7;--tbg:#12393A;--amb:#F2B857;--abg:#3D2E10;--rose:#FB7185;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A1D;--sf:#152429;--ink:#E7F0EE;--mute:#9DB1B3;--line:#27393D;--teal:#5CD1C7;--tbg:#12393A;--amb:#F2B857;--abg:#3D2E10;--rose:#FB7185;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Heebo,system-ui,"Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px;margin:2px 0 0}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:8px 12px;min-height:40px}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button.pri{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:700}
button:disabled{opacity:.55;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-bottom:4px}
.chips button{white-space:nowrap;border-radius:99px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;border-inline-start:5px solid var(--line)}
.card.hi{border-inline-start-color:var(--teal)}.card.mid{border-inline-start-color:var(--amb)}
.card.done{opacity:.6}
.score{text-align:center;font-weight:800;font-size:34px;line-height:1}
.score small{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-top:4px}
.card.hi .score{color:var(--teal)}
h2{font-size:17px;font-weight:700;margin:0 0 2px}
.meta{color:var(--mute);font-size:14px;margin:0}
.why{margin:6px 0 0;font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--tbg);color:var(--teal);font-weight:500}
.tag.p{background:var(--abg);color:var(--amb)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts button,.acts a{font-size:14px;min-height:36px;padding:6px 11px}
.acts a{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;background:var(--sf)}
.empty{padding:32px 12px;text-align:center;color:var(--mute)}
.note{background:var(--abg);color:var(--amb);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
dialog{width:min(640px,94vw);border:1px solid var(--line);border-radius:16px;background:var(--sf);color:var(--ink);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px;font-size:19px}
label{display:block;font-weight:500;font-size:14px;margin:10px 0 4px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
textarea{min-height:130px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:46vh;overflow:auto;margin:10px 0 0}
.msg{font-size:14px;color:var(--mute);margin-top:8px}
</style>
</head>
<body>
<main>
<header>
  <div><h1>המשרות שלי</h1><p class="sub" id="count"></p></div>
  <div style="display:flex;gap:6px"><button id="bAdd" class="pri">הוסיפי משרה</button><button id="bSet">הגדרות</button></div>
</header>
<div id="note"></div>
<div class="chips" id="chips" role="group" aria-label="סינון"></div>
<div id="list"></div>

<dialog id="dAdd"><h3>הוסיפי משרה ודרגי אותה</h3>
  <label for="aTxt">הדביקי את תיאור המשרה</label><textarea id="aTxt"></textarea>
  <label for="aUrl">קישור למשרה (לא חובה)</label><input type="text" id="aUrl" dir="ltr" placeholder="https://">
  <div class="row"><button id="aGo" class="pri">דרגי</button><button data-close>סגירה</button></div><p class="msg" id="aMsg"></p></dialog>

<dialog id="dSet"><h3>הגדרות</h3>
  <label for="sCv">קורות החיים שלך (טקסט). נשמרים רק במכשיר הזה</label><textarea id="sCv"></textarea>
  <label for="sKey">מפתח API של Anthropic, להתאמת קו״ח בתוך האפליקציה (לא חובה). נשמר רק במכשיר הזה</label>
  <input type="password" id="sKey" dir="ltr" autocomplete="off">
  <div class="row"><button id="sSave" class="pri">שמרי</button><button data-close>סגירה</button></div><p class="msg" id="sMsg"></p></dialog>

<dialog id="dCv"><h3 id="cvT">התאמת קורות חיים</h3>
  <label for="cvD">תיאור המשרה (ככל שיהיה מלא יותר, ההתאמה טובה יותר)</label><textarea id="cvD"></textarea>
  <div class="row"><button id="cvGo" class="pri">התאימי קו״ח</button><button id="cvCp">העתיקי</button><button id="cvDl">הורידי</button><button data-close>סגירה</button></div>
  <pre id="cvO" hidden></pre></dialog>

<script>
const $=s=>document.querySelector(s);
const PREF="העדפות: חדשנות ברפואה (סטארט־אפ והייטק בריאות) בתפקידי דאטה אנליסט או ניהול פרויקטים; חלקית או פרילנס; היברידי; אזור המרכז; תפקיד שטח; חברה ואנשים טובים; תפקיד מעניין ומיוחד.";
const FILTERS=[["all","הכול"],["innov","חדשנות ברפואה"],["part","חלקית או פרילנס"],["new","חדשות"],["applied","הגשתי"],["dismissed","לא מעניין"]];
const INN=/startup|סטארט|digital health|health ?tech|medtech|בריאות דיגיטלית|בינה מלאכותית|\bAI\b|חדשנות|innovation/i;
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const lset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let jobs=[],mj=ls("mj",[]),st=ls("st",{}),cv=ls("cv",""),filter="all",cur=null;
const all=()=>jobs.concat(mj);

function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}for(const c of kids.flat())if(c!=null)e.append(c);return e}
function note(t){const n=$("#note");n.replaceChildren();if(t)n.append(h("div",{class:"note"},t))}
const date=ts=>ts?new Date(ts).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"}):"";
const S=j=>st[j.id]||"new";

function visible(){const f=filter;let l=all().filter(j=>{const s=S(j);
  if(f==="dismissed")return s==="dismissed";if(f==="applied")return s==="applied";if(s==="dismissed")return false;
  if(f==="innov")return j.innov;if(f==="part")return j.part;if(f==="new")return s==="new";return true});
  const k=j=>j.score+(j.innov?1:0)+(j.part?1:0);return l.sort((a,b)=>k(b)-k(a))}

function render(){
  const A=all(),last=Math.max(0,...jobs.map(j=>j.ts));
  $("#count").textContent=A.filter(j=>S(j)==="new").length+" משרות חדשות"+(last?", עדכון אחרון של הבוט: "+date(last):"");
  $("#chips").replaceChildren(...FILTERS.map(([k,t])=>h("button",{"aria-pressed":String(filter===k),onclick:()=>{filter=k;render()}},t)));
  const L=$("#list");L.replaceChildren();const v=visible();
  if(!v.length){L.append(h("div",{class:"empty"},A.length?"אין משרות בסינון הזה.":"אין משרות עדיין. הבוט מעדכן את הרשימה כל 30 דקות."));return}
  for(const j of v){const s=S(j),cls=j.score>=8?"hi":j.score>=6?"mid":"";
    L.append(h("article",{class:"card "+cls+(s!=="new"?" done":"")},
      h("div",{class:"score"},String(j.score),h("small",{},"מתוך 10")),
      h("div",{},h("h2",{},j.title),h("p",{class:"meta"},[j.company,j.location,j.ts?"נמצאה ב-"+date(j.ts):""].filter(Boolean).join(", ")),
        j.reason?h("p",{class:"why"},j.reason):null,
        h("div",{class:"tags"},j.innov?h("span",{class:"tag"},"חדשנות ברפואה"):null,j.part?h("span",{class:"tag p"},"חלקית או פרילנס"):null,s==="applied"?h("span",{class:"tag"},"הגשתי"):null,s==="saved"?h("span",{class:"tag"},"שמורה"):null),
        h("div",{class:"acts"},
          /^https:\/\//.test(j.url||"")?h("a",{href:j.url,target:"_blank",rel:"noopener"},"פתחי משרה"):null,
          h("button",{onclick:()=>openCv(j)},"התאימי קו״ח"),
          h("button",{onclick:()=>setS(j,s==="applied"?"new":"applied")},s==="applied"?"ביטול הגשה":"הגשתי"),
          h("button",{onclick:()=>setS(j,s==="saved"?"new":"saved")},s==="saved"?"הסירי שמירה":"שמרי"),
          h("button",{onclick:()=>setS(j,s==="dismissed"?"new":"dismissed")},s==="dismissed"?"החזירי":"לא מעניין")))))}
}
function setS(j,s){if(s==="new")delete st[j.id];else st[j.id]=s;lset("st",st);render()}

// קריאה ל-Claude עם המפתח האישי (נשמר רק בדפדפן הזה)
async function ask(prompt,model,max){const k=ls("ak","");if(!k)throw new Error("nokey");
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:max,messages:[{role:"user",content:prompt}]})});
  if(!r.ok)throw new Error("http"+r.status);const d=await r.json();return d.content.map(c=>c.text||"").join("")}
const err=e=>e&&e.message==="nokey"?"הוסיפי מפתח API בהגדרות.":"הפעולה נכשלה. נסי שוב.";

$("#aGo").onclick=async()=>{const t=$("#aTxt").value.trim(),u=$("#aUrl").value.trim(),m=$("#aMsg");if(!t)return;
  $("#aGo").disabled=true;m.textContent="מדרגת...";
  try{const x=await ask("קורות החיים:\n"+cv+"\n\n"+PREF+"\n\nהמשרה:\n"+t.slice(0,5000)+"\n\nדרגי 1-10 עד כמה כדאי לה לגשת. שקלי התאמה, חדשנות ברפואה, חברה ואנשים, עניין וייחודיות, תפקיד שטח, חלקית או פרילנס. תפקיד שגרתי = ציון נמוך. החזירי JSON בלבד: {\"title\":\"\",\"company\":\"\",\"location\":\"\",\"score\":0,\"reason\":\"עד 20 מילים בעברית\",\"part\":false,\"innov\":false}","claude-haiku-5-5",400);
    const r=JSON.parse(x.match(/\{[\s\S]*\}/)[0]);
    mj.unshift({id:"m"+Date.now(),title:String(r.title||"משרה"),company:String(r.company||""),location:String(r.location||""),url:/^https:\/\//.test(u)?u:"",score:Math.max(1,Math.min(10,Math.round(+r.score||5))),reason:String(r.reason||""),part:!!r.part,innov:!!r.innov,ts:Date.now(),text:t.slice(0,4000)});
    lset("mj",mj);render();$("#aTxt").value="";$("#aUrl").value="";m.textContent="";$("#dAdd").close()}
  catch(e){m.textContent=err(e)}$("#aGo").disabled=false};

$("#sSave").onclick=()=>{cv=$("#sCv").value;lset("cv",cv);const k=$("#sKey").value.trim();if(k)lset("ak",k);$("#sKey").value="";$("#sMsg").textContent="נשמר במכשיר הזה."};

function openCv(j){cur=j;$("#cvT").textContent="התאמת קו״ח: "+j.title;$("#cvD").value=j.text||"";$("#cvO").hidden=true;$("#dCv").showModal()}
$("#cvGo").onclick=async()=>{const o=$("#cvO"),b=$("#cvGo");o.hidden=false;
  if(!cv){o.textContent="קודם הדביקי את קורות החיים בהגדרות.";return}
  const jd=$("#cvD").value.trim()||(cur.title+", "+cur.company+", "+cur.location);
  const p="קורות החיים:\n"+cv+"\n\nהמשרה:\n"+jd.slice(0,5000)+"\n\nהתאימי את קורות החיים למשרה. אל תמציאי ניסיון, כישורים או תארים שאין בקורות החיים. החזירי בעברית: 1) תקציר מקצועי מותאם (3 שורות). 2) ניסוח מחדש של נקודות הניסיון הרלוונטיות ביותר, בסדר חשיבות. 3) מילות מפתח מהמשרה שכדאי להוסיף, ואילו מהן חסרות לה בפועל. 4) משפט פתיחה למכתב מקדים.";
  if(!ls("ak","")){try{await navigator.clipboard.writeText(p)}catch(e){}window.open("https://claude.ai/new","_blank","noopener");o.textContent="אין מפתח API, אז הבקשה הועתקה. הדביקי אותה בשיחה חדשה עם Claude שנפתחה. כדי שההתאמה תתבצע כאן, הוסיפי מפתח בהגדרות.";return}
  b.disabled=true;o.textContent="מתאימה...";
  try{o.textContent=await ask(p,"claude-sonnet-5-5",1800)}catch(e){o.textContent=err(e)}b.disabled=false};
$("#cvCp").onclick=async()=>{try{await navigator.clipboard.writeText($("#cvO").textContent)}catch(e){}};
$("#cvDl").onclick=()=>{const a=h("a",{href:URL.createObjectURL(new Blob([$("#cvO").textContent],{type:"text/markdown"})),download:"cv-tailored.md"});document.body.append(a);a.click();a.remove()};

$("#bAdd").onclick=()=>$("#dAdd").showModal();
$("#bSet").onclick=()=>{$("#sCv").value=cv;$("#dSet").showModal()};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());

(async()=>{
  try{const r=await fetch("state.json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();
    jobs=Object.entries(d.jobs||{}).filter(([i,v])=>v&&v.t&&!v.closed&&v.score>=(v.ai?5:4)).map(([id,v])=>({id,title:v.t,company:v.c||"",location:v.l||"",url:v.u||"",score:v.score,reason:v.r||"",part:!!v.part,innov:INN.test(v.t+" "+(v.c||"")+" "+(v.r||"")),ts:(v.ts||0)*1000}))}
  catch(e){note("עדיין אין נתונים מהבוט. הריצי אותו מלשונית Actions ב-GitHub.")}
  render()})();
</script>
</body>
</html>
